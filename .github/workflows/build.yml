name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee build.log

      - name: Publicar log de erro no branch buildlog
        if: failure()
        run: |
          mkdir -p logdir && grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log > logdir/erros.txt || true
          tail -200 build.log > logdir/fim.txt
          cd logdir && git init -q -b buildlog && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -qm "log ${GITHUB_RUN_NUMBER}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" buildlog

      - name: Preparar APK
        run: |
          V="1.0.${GITHUB_RUN_NUMBER}"
          echo "V=$V" >> $GITHUB_ENV
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/Androcar_Gps.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Androcar_Gps-apk
          path: out/*.apk

      # Link de download fixo:
      #   https://github.com/heitorcampos2/Androcar_Gps/releases/latest/download/Androcar_Gps.apk
      # O app lê a release mais recente para se atualizar.
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$V"
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          MSG=$(git log -1 --pretty=%s)
          gh release create "$TAG" out/Androcar_Gps.apk \
            --title "Androcar GPS $V" --latest \
            --notes "$MSG"
